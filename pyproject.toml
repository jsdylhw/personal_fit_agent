[project]
name = "personal-fit-agent"
version = "0.1.0"
description = "Local FIT archive, analysis, plotting, and AI tool API"
requires-python = ">=3.12"
dependencies = [
  "fitdecode>=0.11.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "typer>=0.9.0",
  "pandas>=2.0.0",
  "matplotlib>=3.8.0",
  "pyyaml>=6.0",
]

[project.scripts]
fit-agent = "app.cli:app"
