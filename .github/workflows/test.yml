name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run deterministic agent evaluation
        run: python -m evaluation.cli run --mode router --output /tmp/personal-fit-agent-eval --fail-under 1.0

      - name: Compile Python sources
        run: python -m compileall -q agent app core evaluation fit sinks demo

      - name: Check demo JavaScript syntax
        run: node --check demo/osm_cycling_router/web/app.js
