<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal FIT Agent</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Personal FIT Agent</h1>
          <p>Garmin 下载、本地 FIT 分析、报告查看和 Strava 上传。</p>
        </div>
        <div id="status" class="status">准备就绪</div>
      </header>

      <section class="controls">
        <label class="token-field">
          API Token
          <input id="apiToken" type="password" autocomplete="off" placeholder="局域网访问时填写" />
        </label>
        <button id="connectGarminBtn">连接 Garmin</button>
        <label class="count-field">
          下载最近
          <input id="downloadCount" type="number" min="1" max="50" value="5" />
          条
        </label>
        <button id="downloadBtn" class="primary">下载</button>
        <button id="refreshBtn">刷新本地 FIT</button>
      </section>

      <section class="layout">
        <section class="panel">
          <div class="panel-header">
            <h2>本地 FIT</h2>
            <span id="fitDir" class="muted"></span>
          </div>
          <div id="fitList" class="fit-list"></div>
        </section>

        <section class="panel detail-panel">
          <div class="panel-header">
            <div>
              <h2 id="detailTitle">选择一个 FIT 文件</h2>
              <p id="detailMeta" class="muted"></p>
            </div>
          </div>

          <div id="summaryGrid" class="summary-grid"></div>

          <div class="action-row">
            <button id="analyzeBtn" class="primary">大模型分析</button>
            <button id="viewReportBtn">查看报告</button>
            <button id="uploadStravaBtn">上传 Strava</button>
          </div>

          <section class="report-preview">
            <h3>Strava 总结</h3>
            <p id="stravaSummary" class="summary-text">分析后会显示。</p>
          </section>

          <section class="report-preview">
            <h3>报告</h3>
            <pre id="reportText" class="report-text">点击“查看报告”后显示。</pre>
          </section>
        </section>
      </section>

      <section class="log-panel">
        <h2>操作日志</h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
